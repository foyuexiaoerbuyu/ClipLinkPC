plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cliplink.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.cliplink.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // WebSocket 客户端：纯 Java 实现（不依赖 OkHttp / Android socket）
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    // org.json 为 Android 平台自带，无需额外依赖

    // AndroidX 官方组件（非第三方 UI 库）：
    // RecyclerView 列表控件（§75 历史列表）
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // ContextCompat.startForegroundService / 运行时权限（§91-§92）
    implementation 'androidx.core:core:1.13.1'
}
